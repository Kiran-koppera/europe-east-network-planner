name: Weekly refresh and deploy

# Every Monday: download the latest public feed, rerun the pipeline, record the
# network changelog snapshot, and publish the site to GitHub Pages.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "src/**", "data/history/**"]

# Snapshots are kept on the data-history branch so that main holds only source code.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Restore snapshot history (data-history branch)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data-history >/dev/null; then
            git fetch origin data-history
            git worktree add hist origin/data-history -B data-history
          else
            git worktree add --orphan -b data-history hist
          fi
          mkdir -p hist/history data/history
          cp -n hist/history/*.json.gz data/history/ 2>/dev/null || true
      - name: Download feed and population data
        run: python -m planner download
      - name: Run pipeline
        run: python -m planner run
      - name: Data-quality gate (fail on errors)
        run: |
          python - <<'PY'
          import json, sys
          q = json.load(open("output/metrics.json"))["metrics"]["quality"]
          print(q)
          sys.exit(1 if q["errors"] else 0)
          PY
      - name: Save weekly snapshot to the data-history branch
        if: github.event_name != 'pull_request'
        run: |
          cp data/history/*.json.gz hist/history/
          cd hist
          git add history
          git diff --cached --quiet || git commit -m "data: weekly network snapshot $(date -u +%F)"
          git push origin data-history
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
