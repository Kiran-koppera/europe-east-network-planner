name: Weekly refresh and deploy

# Every Monday: download the latest public feed, rerun the pipeline, record the
# network changelog snapshot, and publish the site to GitHub Pages.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "src/**", "data/history/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Download feed and population data
        run: python -m planner download
      - name: Run pipeline
        run: python -m planner run
      - name: Data-quality gate (fail on errors)
        run: |
          python - <<'PY'
          import json, sys
          q = json.load(open("output/metrics.json"))["metrics"]["quality"]
          print(q)
          sys.exit(1 if q["errors"] else 0)
          PY
      - name: Commit weekly snapshot
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history
          git diff --cached --quiet || git commit -m "data: weekly network snapshot $(date -u +%F)"
          git push || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
